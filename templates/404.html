{% extends "base.html" %}

{% block title %}404 - Page Not Found{% endblock %}

{% block content %}
<div class="card" style="max-width: 600px; margin: 60px auto; text-align: center; padding: 48px;">
    <div style="font-size: 4rem; color: var(--accent-teal); margin-bottom: 16px;">
        <i class="fa-solid fa-compass-drafting"></i>
    </div>
    <h1 style="font-size: 2rem; font-weight: 800; margin-bottom: 8px;">404 - Page Not Found</h1>
    <p style="font-size: 0.95rem; color: var(--text-secondary); margin-bottom: 24px;">
        The campus page or resource you are looking for does not exist or has been moved.
    </p>
    <a href="{{ url_for('auth.dashboard') }}" class="btn btn-primary">
        &larr; Return to Dashboard
    </a>
</div>
{% endblock %}
