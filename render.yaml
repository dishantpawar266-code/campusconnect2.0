services:
  - type: web
    name: campus-connect
    env: python
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: campus-connect-db
          property: connectionString

databases:
  - name: campus-connect-db
    databaseName: campus_connect_db
    user: campus_user
    plan: free
