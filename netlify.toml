[build]
  functions = "netlify/functions"
  publish = "static"

[functions]
  included_files = [
    "campus_connect.db",
    "templates/**",
    "static/**",
    "routes/**",
    "models.py",
    "database.py",
    "config.py",
    "app.py"
  ]

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/app"
  status = 200
